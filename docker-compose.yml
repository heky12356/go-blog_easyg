version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/test.db:/root/test.db
    environment:
      - GIN_MODE=release
  
  frontend:
    build: ./easyg-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production